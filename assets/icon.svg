<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1c3a"/>
      <stop offset="0.55" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#061024"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3987e5"/>
      <stop offset="0.6" stop-color="#22c48a"/>
      <stop offset="1" stop-color="#7ef0c0"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c48a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3987e5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9ff5d3" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#22c48a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22c48a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sheen" cx="0.2" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#5598e7" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#5598e7" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/></filter>
    <clipPath id="rr"><rect x="0" y="0" width="512" height="512" rx="116"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#sheen)"/>
  <g clip-path="url(#rr)">
    <!-- fine grid -->
    <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="2">
      <path d="M0 176H512M0 256H512M0 336H512M0 416H512"/>
      <path d="M128 0V512M256 0V512M384 0V512"/>
    </g>
    <!-- glow blob -->
    <circle cx="392" cy="150" r="120" fill="url(#glow)" opacity="0.55" filter="url(#soft)"/>
    <!-- candles -->
    <g stroke-linecap="round">
      <g stroke="#3987e5" stroke-opacity="0.9"><path d="M124 398V330" stroke-width="6"/><rect x="108" y="342" width="32" height="44" rx="6" fill="#3987e5"/></g>
      <g stroke="#e66767" stroke-opacity="0.9"><path d="M188 372V286" stroke-width="6"/><rect x="172" y="300" width="32" height="50" rx="6" fill="#e66767"/></g>
      <g stroke="#3987e5" stroke-opacity="0.9"><path d="M252 342V236" stroke-width="6"/><rect x="236" y="252" width="32" height="66" rx="6" fill="#3987e5"/></g>
      <g stroke="#22c48a"><path d="M316 296V176" stroke-width="6"/><rect x="300" y="196" width="32" height="80" rx="6" fill="#22c48a"/></g>
    </g>
    <!-- trend area + line -->
    <path d="M78 392 C150 380 190 340 236 300 C282 262 318 240 366 196 C400 166 424 142 448 116 L448 440 L78 440 Z" fill="url(#area)"/>
    <path d="M78 392 C150 380 190 340 236 300 C282 262 318 240 366 196 C400 166 424 142 448 116" fill="none" stroke="url(#line)" stroke-width="22" stroke-linecap="round" filter="url(#shadow)"/>
    <path d="M78 392 C150 380 190 340 236 300 C282 262 318 240 366 196 C400 166 424 142 448 116" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
    <!-- arrow head -->
    <path d="M402 104 L452 112 L444 162" fill="none" stroke="url(#line)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- glowing node -->
    <circle cx="448" cy="116" r="30" fill="url(#glow)"/>
    <circle cx="448" cy="116" r="12" fill="#ffffff"/>
    <!-- shekel / dollar marks -->
    <g font-family="Heebo, Arial, Helvetica, sans-serif" font-weight="800" fill="#ffffff" fill-opacity="0.92">
      <text x="86" y="140" font-size="64">₪</text>
      <text x="82" y="222" font-size="58" fill-opacity="0.55">$</text>
    </g>
  </g>
</svg>
